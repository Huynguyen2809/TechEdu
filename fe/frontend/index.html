<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tiêu đề & SEO -->
    <title>TechEdu - Hệ Thống Kiểm Tra Trực Tuyến THPT</title>
    <meta
      name="description"
      content="Hệ thống hỗ trợ học tập, kiểm tra và đánh giá trực tuyến các môn Khoa học Tự nhiên (Toán, Lý, Hóa) khối THPT với kiến trúc chia đôi màn hình."
    />
    <meta
      name="keywords"
      content="thi trực tuyến, trắc nghiệm, toán lý hóa, THPT, azota, shub classroom, chấm điểm tự động"
    />
    <meta name="author" content="Assessment Edu Team" />

    <!-- Tối ưu hiệu suất & Tích hợp Google Font: Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Styles nhúng trực tiếp cho Màn hình chờ tải trang (Pre-loader) -->
    <style>
      body {
        font-family:
          "Be Vietnam Pro",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
      }
      .app-preloader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background-color: #f8fafc;
        color: #1f4e78;
      }
      .spinner {
        width: 45px;
        height: 45px;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #1f4e78;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .preloader-text {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.5px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <!-- Thẻ root: Nơi React sẽ gắn giao diện vào -->
    <div id="root">
      <!-- Màn hình chờ tải trang sẽ hiển thị trước khi React tải xong -->
      <div class="app-preloader">
        <div class="spinner"></div>
        <div class="preloader-text">ĐANG KHỞI TẠO HỆ THỐNG...</div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
