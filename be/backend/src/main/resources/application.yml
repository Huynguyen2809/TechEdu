server:
  port: 8080
  tomcat:
    max-swallow-size: -1 # Ngăn Tomcat reset connection khi file upload vượt quá dung lượng
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: false # Để false vì đang test localhost (chưa có HTTPS)
        max-age: 86400 # 24 giờ
        same-site: lax # BỔ SUNG QUAN TRỌNG: Cho phép Cookie đi qua lại giữa cổng 5173 và 8080 trên localhost

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  data:
    mongodb:
      uri: mongodb://localhost:27017/techedu_db
      database: techedu_db
      gridfs:
        database: techedu_db
  datasource:
    url: jdbc:mysql://localhost:3306/edu_assessment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
